spring:
  application:
    name: rbpo-lab2
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  admin:
    password: ${ADMIN_PASSWORD:AdminPass123!}